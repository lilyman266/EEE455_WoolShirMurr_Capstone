<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audimus Ground Station - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet/styles.css') }}">
    <link rel="icon" href="/static/audimus_logo.png">
</head>
<body>
<div id="app-root">

    <!-- Top Bar -->
    <header id="top-bar">

        <!-- Logo -->
        <div id="logo-container">
            <!-- Replace src with your static path -->
            <img src="/static/audimus_logo.png" alt="Audimus Logo">
        </div>

    </header>

    <main class="content-section">
        <div class="content-box fixed-height fixed-width">
            <form  id="login-form" action="/login_test" method="POST">
                <input id="username" name="username" type="text" placeholder="Username">
                <input id="password" name="password" type="password" placeholder="Password">
                <input id="submit" name="submit" type="submit" value="Login">
            </form>
            <div>
            <button id="create-account-button">Create Account</button>
            <button id="continue-as-guest">Continue as Guest</button>
            </div>
        </div>
    </main>
</div>
<!-- Create account and continue as guest buttons: -->
<script defer>
  const create_account_button = document.getElementById("create-account-button");

  create_account_button.addEventListener("click", async (e) => {
    e.preventDefault();

    const uname = document.getElementById("username").value.trim();
    const passwd = document.getElementById("password").value;

    if (!uname || !passwd) {
      alert("Username or password field empty!");
      return;
    }

    const response = await fetch("/create_account", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: uname, password: passwd })
    });

    const message = await response.json().catch(() => ({}));

    if (response.ok && message.ok) {
      alert(message.message || "Account created!");
    } else {
      alert(message.message || "Failed to create account.");
    }
  });

  const continue_as_guest_button = document.getElementById("continue-as-guest");
  continue_as_guest_button.addEventListener("click", () => {
    window.location.href = "/guest";
  });
</script>
</body>
</html>
