<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audimus Ground Station</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet/styles.css') }}">
    <link rel="icon" href="/static/audimus_logo.png">
    <script>
        let clicked_id = null;
        let clicked_set = null;
        /*function to reach out to the database:
        params:
            key: the local key
            page: the page requesting
            datalist: the list they are requesting from*/
        async function admin_populate_databox({id=null} = {}) {
            const box = document.getElementById(id);
            let response;
            try { response = await fetch("/get_all_data", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    page: "admin",
                    datalist: "acoustic_data"
                })
            });} catch (error) {
                box.textContent = "Error: Could not reach server.";
                return;
            }
            const data = await response.json();
            data.forEach((item) => {
                //create new thing
                const new_set = document.createElement("div");
                new_set.classList.add("dataset-row");
                new_set.textContent = item["timestamp"] ?? "No timestamp" + " : " + item["restricted"] + " : " +  item["raw_data"];

                //new_set.dataset.datasetId = item.id;
                const my_id = item["id"];

                new_set.addEventListener("click", () => {
                    const currentlyActive = document.querySelector(".dataset-row.active");

                    if (currentlyActive && currentlyActive !== new_set) {
                        currentlyActive.classList.remove("active");
                    }

                    new_set.classList.add("active");
                    clicked_id = my_id;
                });
                //append it to the list
                box.appendChild(new_set);
                })
            }

        async function get_requests() {
        const box = document.getElementById("requests");
        let response;
        try { response = await fetch("/get_user_requests", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
        });} catch (error) {
            box.textContent = "Error: Could not reach server.";
            return;
        }
        const data = await response.json();
        data.forEach((item) => {
            //create new thing
            const new_set = document.createElement("div");
            new_set.classList.add("dataset-row");
            //TODO: figure out how to get the CORRESPONDING ROW, not just the ID
            new_set.textContent = "user" + item[0] + item["timestamp"] ?? "No timestamp" + " : " + item["restricted"] + " : " +  item["raw_data"];

            //new_set.dataset.datasetId = item.id;
            const my_id = item["id"];

            new_set.addEventListener("click", () => {
                const currentlyActive = document.querySelector(".dataset-row.active");

                if (currentlyActive && currentlyActive !== new_set) {
                    currentlyActive.classList.remove("active");
                }

                new_set.classList.add("active");
                clicked_set = my_id;
            });
            //append it to the list
            box.appendChild(new_set);
            })
        }
    </script>

<body>

<div id="app-root">

    <!-- Top Bar -->
    <header id="top-bar">

        <!-- Logo -->
        <div id="logo-container">
            <!-- Replace src with your static path -->
            <img src="/static/audimus_logo.png" alt="Audimus Logo">
        </div>

        <!-- Buttons -->
        <nav id="nav-controls">
            <button class="nav-button" id="logout-button">Logout</button>
            <button class="nav-button" id="data-accept-button">Accept Data Request</button>
            <button class="nav-button" id="download-button">Download</button>
        </nav>

    </header>

    <!-- Dataset List -->
    <main class="content-section">
        <div class="content-box fixed-height" id="data">
            <div class="dataset-header">
                <div>Ground Station Datasets:</div>
            </div>
        <script>
            admin_populate_databox({id:"data"});
        </script>
        </div>

        <br>
        <br>


         <div class="content-box fixed-height" id="requests">
            <div class="dataset-header">
                <div>Dataset Requests</div>
            </div>
             <script>
                get_requests();
             </script>
         </div>
    </main>

    </div>
    <!-- Download Button: -->
    <script defer>
        const download_button = document.getElementById("download-button");
        download_button.addEventListener("click", async () => {
            if (clicked_id !== null) {
                const response = await fetch("/data", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        id: clicked_id
                    })
                });
                const data = await response.json();
                // 2. Create a Blob (in-memory file)
                const blob = new Blob([data[0]["raw_data"]], { type: 'text/plain' });
                // 3. Create a temporary object URL
                const url = URL.createObjectURL(blob);
                // 4. Create and click a hidden <a>
                const a = document.createElement('a');
                a.href = url;
                a.download = 'server_data.txt';
                document.body.appendChild(a);
                a.click();
                // 5. Cleanup
                URL.revokeObjectURL(url);
                a.remove();
            } else {
                console.warn("Please select a dataset!")
            }
        })
    </script>

    <!-- User Home Button: -->
    <script defer>
        const user_home_button = document.getElementById("accept-user-button");
        //TODO: Make this accept user request! Should be layer 3 in process.
        user_home_button.addEventListener("click", async () => {
            // *__*
        })
    </script>
    <!-- Logout Button: -->
    <script defer>
        const logout_button = document.getElementById("logout-button");

        logout_button.addEventListener("click", async () => {
            window.location.href = "/logout";
        })
    </script>
</body>
</html>
